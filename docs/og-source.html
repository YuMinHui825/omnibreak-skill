<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OG</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1280px; height:640px; overflow:hidden; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:#0E0E15; color:#E9E7E2; position:relative;
  }
  .mono{ font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  .glow{
    position:absolute; inset:0;
    background:
      radial-gradient(560px 400px at 8% 4%, rgba(77,182,172,.22), transparent 68%),
      radial-gradient(520px 420px at 96% 90%, rgba(255,183,77,.16), transparent 68%),
      radial-gradient(420px 320px at 70% 0%, rgba(239,83,80,.09), transparent 70%);
  }
  .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(233,231,226,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(233,231,226,.045) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(ellipse 80% 90% at 30% 40%, #000 20%, transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse 80% 90% at 30% 40%, #000 20%, transparent 80%);
  }
  .frame{
    position:absolute; inset:26px; border:1px solid rgba(233,231,226,.1); border-radius:20px;
  }

  .content{ position:absolute; left:74px; top:96px; width:720px; }

  .kicker{
    display:inline-flex; align-items:center; gap:10px;
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    font-size:15px; letter-spacing:.26em; text-transform:uppercase;
    color:#4DB6AC; border:1px solid rgba(77,182,172,.34);
    background:rgba(77,182,172,.08); border-radius:999px; padding:9px 20px;
  }
  .kicker i{ width:8px; height:8px; border-radius:50%; background:#4DB6AC; box-shadow:0 0 10px #4DB6AC; }

  h1{ margin-top:38px; font-size:82px; line-height:1.16; letter-spacing:-.03em; font-weight:800; }
  h1 .hl{
    background:linear-gradient(180deg,#FFE082,#FFB74D);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{
    margin-top:28px; font-size:24px; line-height:1.7; color:#9A98A8; letter-spacing:.01em;
  }
  .sub b{ color:#E9E7E2; font-weight:600; }

  .right{ position:absolute; right:78px; top:50%; transform:translateY(-50%); }
  .bolt{ width:300px; height:300px; }
  .ring{
    position:absolute; inset:-30px; border-radius:50%;
    border:1px dashed rgba(77,182,172,.22);
  }
  .ring2{ position:absolute; inset:22px; border-radius:50%; border:1px dashed rgba(239,83,80,.20); }

  .foot{
    position:absolute; left:74px; bottom:58px; right:74px;
    display:flex; align-items:center; justify-content:space-between;
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    font-size:17px; letter-spacing:.1em; color:#5E5C70;
  }
  .foot .accent{ color:#9A98A8; }
  .foot .dotline{ display:flex; align-items:center; gap:10px; }
  .foot .d{ width:9px; height:9px; border-radius:50%; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="frame"></div>

  <div class="content">
    <div class="kicker"><i></i>Remote Linux Debugger</div>
    <h1>AI 写代码，<br><span class="hl">它让代码跑通</span>。</h1>
    <div class="sub">真断点 · 真崩溃回溯 · CPU/GPU 火焰图<br><b>deploy → break → fix → loop</b></div>
  </div>

  <div class="right">
    <div class="ring"></div>
    <div class="ring2"></div>
    <svg class="bolt" viewBox="0 0 256 256" fill="none">
      <path d="M128 24 A104 104 0 0 1 232 128" stroke="#4DB6AC" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M128 232 A104 104 0 0 1 24 128" stroke="#FFB74D" stroke-width="7" fill="none" stroke-linecap="round"/>
      <circle cx="128" cy="128" r="74" fill="none" stroke="#EF5350" stroke-width="12" stroke-dasharray="86 22" stroke-linecap="round"/>
      <polygon points="128,46 170,124 146,124 160,212 96,124 120,124" fill="#FFE082"/>
    </svg>
  </div>

  <div class="foot">
    <span>OMNIBREAK-SKILL&nbsp;&nbsp;<span class="accent">· v0.9.0 · MIT</span></span>
    <span class="dotline">
      <span class="d" style="background:#4DB6AC"></span>
      <span class="d" style="background:#FFB74D"></span>
      <span class="d" style="background:#EF5350"></span>
      <span style="margin-left:14px" class="accent">github.com/YuMinHui825/omnibreak-skill</span>
    </span>
  </div>
</body>
</html>
